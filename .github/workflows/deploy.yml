name: Prepare release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production
      api_url:
        description: Full API URL including /api/v1
        required: true
        default: https://badenya-api.naimba.com/api/v1
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RELEASE_ID: ${{ inputs.environment == 'production' && github.sha || format('staging-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - if: inputs.environment == 'production'
        run: |
          npm run test:unit --workspace=backend -- --runInBand
          npm run test:integration --workspace=backend -- --runInBand
          npm test --workspace=admin -- --runInBand
          npm test --workspace=landing-page -- --runInBand
      - if: inputs.environment == 'production'
        run: npm run test:ci
        working-directory: mobile
      - run: bash scripts/prepare-release.sh "$RELEASE_ID"
        env:
          BADENYA_ARTIFACT_DIR: ${{ runner.temp }}/badenya-releases
          VITE_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: badenya-${{ env.RELEASE_ID }}
          path: ${{ runner.temp }}/badenya-releases/${{ env.RELEASE_ID }}
          if-no-files-found: error
