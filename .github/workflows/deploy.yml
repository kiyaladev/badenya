name: Prepare production release
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run test:unit --workspace=backend -- --runInBand
      - run: npm run test:integration --workspace=backend -- --runInBand
      - run: npm test --workspace=admin -- --runInBand
      - run: npm test --workspace=landing-page -- --runInBand
      - run: npm run test:ci
        working-directory: mobile
      - run: bash scripts/prepare-release.sh "${{ github.sha }}"
        env:
          BADENYA_ARTIFACT_DIR: ${{ runner.temp }}/badenya-releases
          VITE_API_URL: https://badenya-api.naimba.com/api/v1
          EXPO_PUBLIC_API_URL: https://badenya-api.naimba.com/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: badenya-${{ github.sha }}
          path: ${{ runner.temp }}/badenya-releases/${{ github.sha }}
          if-no-files-found: error
