name: Prepare staging release
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Full staging API URL including /api/v1
        required: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: bash scripts/prepare-release.sh "staging-${{ github.sha }}"
        env:
          BADENYA_ARTIFACT_DIR: ${{ runner.temp }}/badenya-releases
          VITE_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: badenya-staging-${{ github.sha }}
          path: ${{ runner.temp }}/badenya-releases/staging-${{ github.sha }}
          if-no-files-found: error
