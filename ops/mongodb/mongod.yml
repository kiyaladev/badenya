storage:
  dbPath: /var/lib/badenya-mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
systemLog:
  destination: file
  path: /var/log/badenya-mongodb/mongod.log
  logAppend: true
net:
  port: 27019
  bindIp: "127.0.0.1,::1"
  ipv6: true
replication:
  replSetName: badenya-rs
security:
  authorization: enabled
  keyFile: /etc/badenya-mongodb/keyfile
processManagement:
  fork: false
